# Pruebas en cada push y pull request: las funciones sueltas, schema.sql en un
# Postgres en memoria y la prueba de humo en Chrome. No necesita ningún secreto:
# no inicia sesión ni llama a ninguna IA.
name: Pruebas

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Prueba de humo (Chrome sin ventana)
        run: npm run smoke
        env:
          CHROME_PATH: /usr/bin/google-chrome
